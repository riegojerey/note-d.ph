# Used by wrangler for the D1 database commands (migrations, create-user).
# Cloudflare Pages itself gets the DB binding from the dashboard:
#   Pages project → Settings → Functions → D1 database bindings → DB = noted-db
name = "note-d"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "noted-db"
# Replace with the id printed by `npx wrangler d1 create noted-db`
database_id = "local-noted-db"
migrations_dir = "migrations"
