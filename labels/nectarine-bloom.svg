<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5f0e4"/>
    </linearGradient>
  </defs>

  <!-- scalloped die-cut shape -->
  <path d="M 0,0 L 640,0 L 640,2.0 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 a 4,4 0 0,0 0,8 L 640,100 L 0,100 L 0,98.0 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 a 4,4 0 0,0 0,-8 L 0,0 Z" fill="url(#bg)" stroke="#d4c9a8" stroke-width="1"/>

  <!-- inner decorative border -->
  <path d="M 4,4 L 636,4 L 636,5.0 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 a 3,3 0 0,0 0,6 L 636,96 L 4,96 L 4,95.0 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 a 3,3 0 0,0 0,-6 L 4,4 Z" fill="none" stroke="#e0d6c0" stroke-width="0.4"/>

  <!-- === LEFT SIDE === -->
  <!-- logo mark -->
  <g transform="translate(24,10) scale(0.9)">
    <path d="M6 32 L6 4 L26 32 L26 4" stroke="#4a3f35" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
    <circle cx="38" cy="28" r="3" stroke="#c8a45c" stroke-width="1" fill="none"/>
  </g>

  <!-- brand -->
  <text x="62" y="21" font-family="Georgia,serif" font-size="7" fill="#4a3f35" letter-spacing="2.5">NOTE.D</text>
  <text x="62" y="31" font-family="Georgia,serif" font-size="5" fill="#a09078" font-style="italic">handcrafted in the philippines</text>

  <!-- perfume name -->
  <text x="40" y="62" font-family="Georgia,serif" font-size="18" fill="#4a3f35" font-style="italic" letter-spacing="1">Nectarine Bloom</text>

  <!-- left dotted frame - horizontal only -->
  <line x1="28" y1="46" x2="315" y2="46" stroke="#2a2a2a" stroke-width="0.4" opacity="0.35" stroke-dasharray="3 4"/>
  <line x1="28" y1="82" x2="315" y2="82" stroke="#2a2a2a" stroke-width="0.4" opacity="0.35" stroke-dasharray="3 4"/>

  <!-- footer -->
  <text x="40" y="95" font-family="Georgia,serif" font-size="5" fill="#bfb098">Note.d  ·  eau de parfum</text>

  <!-- small ornament -->
  <text x="330" y="55" font-family="Georgia,serif" font-size="7" fill="#d4c9a8" opacity="0.5">❦</text>

  <!-- === RIGHT SIDE === -->
  <!-- right content box -->
  <rect x="370" y="22" width="250" height="72" rx="2" stroke="#2a2a2a" stroke-width="0.4" fill="none" opacity="0.35" stroke-dasharray="3 4"/>

  <!-- notes -->
  <text x="380" y="40" font-family="Georgia,serif" font-size="6.5" fill="#6b5c4a" letter-spacing="0.4">Nectarine  ·  Peony  ·  Honey</text>

  <!-- inspired by -->
  <text x="380" y="54" font-family="Georgia,serif" font-size="6" fill="#a09078" font-style="italic">Inspired by Jo Malone Nectarine</text>

  <!-- website + volume -->
  <text x="380" y="72" font-family="Georgia,serif" font-size="5" fill="#a09078">fb.com/notedph</text>
  <text x="380" y="83" font-family="Georgia,serif" font-size="5" fill="#a09078">10mL · 30mL</text>

  <!-- small ornament -->
  <text x="610" y="62" font-family="Georgia,serif" font-size="6" fill="#d4c9a8" opacity="0.4">❦</text>
</svg>