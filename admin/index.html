<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Note.d Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..800,100&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css?v=1" />
</head>
<body>

  <!-- Login -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm">
      <img src="/brand/logo.png" alt="Note.d" class="login-logo" width="110" height="106" />
      <h1>Admin</h1>
      <label>Username <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn-rose btn-block" type="submit">Log in</button>
    </form>
  </main>

  <!-- App -->
  <div class="app" id="appView" hidden>
    <header class="top">
      <a href="/" class="top-logo" title="View the shop"><img src="/brand/mark-white.png" alt="" width="34" height="26" /><span>Admin</span></a>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-tab="dashboard">Dashboard</button>
        <button data-tab="sales">Sales</button>
        <button data-tab="inventory">Inventory</button>
        <button data-tab="expenses">Expenses</button>
        <button data-tab="projections">Projections</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <div class="top-user"><span id="whoami"></span><button class="link" id="logoutBtn">Log out</button></div>
    </header>

    <div class="period" id="periodBar">
      <label>Period
        <select id="period">
          <option value="this-month">This month</option>
          <option value="last-month">Last month</option>
          <option value="last-3">Last 3 months</option>
          <option value="this-year">This year</option>
          <option value="all">All time</option>
          <option value="custom">Custom dates</option>
        </select>
      </label>
      <span class="custom-range" id="customRange" hidden>
        <input type="date" id="fromDate" aria-label="From" /> to <input type="date" id="toDate" aria-label="To" />
      </span>
    </div>

    <main class="content" id="content"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js?v=1"></script>
</body>
</html>
